name: Generate Stats Cards

on:
  schedule:
    - cron: "0 6 * * *" # runs daily at 06:00 UTC
  workflow_dispatch: # lets you trigger it manually from the Actions tab
  push:
    branches:
      - main

permissions:
  contents: write # needed to push the generated SVGs to the stats branch

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate GitHub stats card (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_border=true&theme=default
          path: dist/github-stats.svg
          fail_on_error: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate GitHub stats card (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_border=true&theme=dark
          path: dist/github-stats-dark.svg
          fail_on_error: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&hide_border=true&theme=default
          path: dist/top-langs.svg
          fail_on_error: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&hide_border=true&theme=dark
          path: dist/top-langs-dark.svg
          fail_on_error: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the cards to the stats branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: stats
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
