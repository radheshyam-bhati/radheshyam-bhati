name: Update Living Profile

on:
  schedule:
    - cron: "0 */8 * * *"   # every 8 hours
  workflow_dispatch:        # manual run
  push:
    branches: [main]
    paths-ignore:
      - "README.md"         # avoid loop

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install node-fetch@2

      - name: Generate dynamic sections
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: radheshyam-bhati
        run: node .github/scripts/update-readme.js

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update projects & tech stack" && git push)
